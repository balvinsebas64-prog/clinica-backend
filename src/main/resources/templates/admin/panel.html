<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<!-- SIDEBAR -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<!-- Botón hamburguesa para móvil -->
<button class="sidebar-toggle" onclick="document.querySelector('.app-sidebar').classList.toggle('show')">
    <i class="bi bi-list"></i>
</button>

<!-- CONTENIDO PRINCIPAL -->
<div class="app-content" style="background-color: #f4f7f6; padding: 30px;">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1" style="color: #2d3748;">Dashboard</h2>
            <p class="text-muted mb-0">Bienvenido de nuevo, Administrador</p>
        </div>
        <div class="d-flex gap-3">
            <span class="badge bg-white text-dark shadow-sm p-2">
                <i class="bi bi-calendar text-primary"></i>
                <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}">Fecha</span>
            </span>
        </div>
    </div>

    <!-- TARJETAS DE ESTADÍSTICAS (Estilo Moderno) -->
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100" style="border-radius: 15px;">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-2">Pacientes</h6>
                            <h2 class="fw-bold mb-0" th:text="${totalPacientes}">0</h2>
                        </div>
                        <div class="bg-primary bg-opacity-10 p-3 rounded-circle">
                            <i class="bi bi-people-fill text-primary fs-3"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100" style="border-radius: 15px;">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-2">Citas</h6>
                            <h2 class="fw-bold mb-0" th:text="${totalCitas}">0</h2>
                        </div>
                        <div class="bg-info bg-opacity-10 p-3 rounded-circle">
                            <i class="bi bi-calendar-check-fill text-info fs-3"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100" style="border-radius: 15px;">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-2">Médicos</h6>
                            <h2 class="fw-bold mb-0" th:text="${totalMedicos}">0</h2>
                        </div>
                        <div class="bg-success bg-opacity-10 p-3 rounded-circle">
                            <i class="bi bi-person-badge-fill text-success fs-3"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm h-100" style="border-radius: 15px;">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted mb-2">Usuarios</h6>
                            <h2 class="fw-bold mb-0" th:text="${totalUsuarios}">0</h2>
                        </div>
                        <div class="bg-warning bg-opacity-10 p-3 rounded-circle">
                            <i class="bi bi-shield-lock-fill text-warning fs-3"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- GRÁFICOS -->
    <div class="row g-4 mb-4">
        <!-- Gráfico de Líneas -->
        <div class="col-md-8">
            <div class="card border-0 shadow-sm h-100" style="border-radius: 15px;">
                <div class="card-body">
                    <h5 class="fw-bold mb-4">Resumen de Citas</h5>
                    <canvas id="graficoCitas" height="100"></canvas>
                </div>
            </div>
        </div>
        <!-- Gráfico Circular -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100" style="border-radius: 15px;">
                <div class="card-body">
                    <h5 class="fw-bold mb-4">Estado de Seguros</h5>
                    <canvas id="graficoSeguros" height="200"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- ACCESOS RÁPIDOS (Estilo botones grandes) -->
    <h4 class="fw-bold mb-3 mt-5">Accesos Directos</h4>
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <a href="/pacientes" class="card border-0 shadow-sm text-decoration-none h-100" style="border-radius: 15px; transition: transform 0.2s;">
                <div class="card-body text-center py-4">
                    <i class="bi bi-people-fill text-primary fs-2"></i>
                    <h6 class="mt-3 fw-bold text-dark">Pacientes</h6>
                </div>
            </a>
        </div>
        <div class="col-md-3">
            <a href="/medicos" class="card border-0 shadow-sm text-decoration-none h-100" style="border-radius: 15px;">
                <div class="card-body text-center py-4">
                    <i class="bi bi-person-badge-fill text-success fs-2"></i>
                    <h6 class="mt-3 fw-bold text-dark">Médicos</h6>
                </div>
            </a>
        </div>
        <div class="col-md-3">
            <a href="/admin/seguros" class="card border-0 shadow-sm text-decoration-none h-100" style="border-radius: 15px;">
                <div class="card-body text-center py-4">
                    <i class="bi bi-shield-check text-warning fs-2"></i>
                    <h6 class="mt-3 fw-bold text-dark">Seguros</h6>
                </div>
            </a>
        </div>
        <div class="col-md-3">
            <a href="/reportes/generar" class="card border-0 shadow-sm text-decoration-none h-100" style="border-radius: 15px;">
                <div class="card-body text-center py-4">
                    <i class="bi bi-bar-chart text-info fs-2"></i>
                    <h6 class="mt-3 fw-bold text-dark">Reportes</h6>
                </div>
            </a>
        </div>
    </div>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</div><!-- Cierra app-content -->

<!-- SCRIPTS -->
<div th:replace="~{fragments/scripts :: scripts}"></div>
<!-- ⭐ SCRIPTS DE LOS GRÁFICOS ⭐ -->
<script th:inline="javascript">
    /* <![CDATA[ */
    
    // ⭐ LEER DATOS REALES DESDE THYMELEAF
    const meses = /*[[${meses}]]*/ [];
    const citasPorMes = /*[[${citasPorMes}]]*/ [];
    const segurosActivos = /*[[${segurosActivos}]]*/ 0;
    const segurosMorosos = /*[[${segurosMorosos}]]*/ 0;
    const segurosInactivos = /*[[${segurosInactivos}]]*/ 0;

    // 1. Gráfico de Líneas (Citas Reales)
    const ctxCitas = document.getElementById('graficoCitas');
    new Chart(ctxCitas, {
        type: 'line',
        data: {
            labels: meses,
            datasets: [{
                label: 'Citas por Mes',
                data: citasPorMes,
                borderColor: '#0d6efd',
                backgroundColor: 'rgba(13, 110, 253, 0.1)',
                tension: 0.4,
                fill: true,
                pointRadius: 5,
                pointBackgroundColor: '#0d6efd'
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { 
                y: { beginAtZero: true, grid: { display: false } }, 
                x: { grid: { display: false } } 
            }
        }
    });

    // 2. Gráfico Circular (Seguros Reales)
    const ctxSeguros = document.getElementById('graficoSeguros');
    new Chart(ctxSeguros, {
        type: 'doughnut',
        data: {
            labels: ['Activos', 'Morosos', 'Inactivos'],
            datasets: [{
                data: [segurosActivos, segurosMorosos, segurosInactivos],
                backgroundColor: ['#198754', '#ffc107', '#dc3545'],
                borderWidth: 0
            }]
        },
        options: {
            cutout: '70%',
            plugins: { legend: { position: 'bottom' } }
        }
    });

    // Efecto Hover en las tarjetas de acceso
    document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('mouseenter', () => card.style.transform = 'translateY(-5px)');
        card.addEventListener('mouseleave', () => card.style.transform = 'translateY(0)');
    });

    // Cerrar sidebar en móvil
    document.addEventListener('click', function(e) {
        const sidebar = document.querySelector('.app-sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        if (window.innerWidth <= 992 && sidebar && sidebar.classList.contains('show')) {
            if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                sidebar.classList.remove('show');
            }
        }
    });

    /* ]]> */
</script>

</body>
</html>
