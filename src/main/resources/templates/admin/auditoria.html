<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<button class="sidebar-toggle" onclick="document.querySelector('.app-sidebar').classList.toggle('show')">
    <i class="bi bi-list"></i>
</button>

<div class="app-content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1"><i class="bi bi-shield-lock text-dark"></i> Auditoría del Sistema</h1>
            <p class="text-muted mb-0">Registro de acciones realizadas por los usuarios</p>
        </div>
        <a href="/admin" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver al Panel
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0 align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Fecha y Hora</th>
                        <th>Usuario</th>
                        <th>Acción</th>
                        <th>Detalle</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${registros}">
                        <td th:text="${#temporals.format(r.fecha, 'dd/MM/yyyy HH:mm:ss')}"></td>
                        <td><span class="badge bg-secondary" th:text="${r.usuario}"></span></td>
                        <td><strong th:text="${r.accion}"></strong></td>
                        <td class="text-muted" th:text="${r.detalle}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(registros)}">
                        <td colspan="4" class="text-center text-muted py-4">
                            <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                            <p class="mt-2 mb-0">No hay registros de auditoría aún</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
