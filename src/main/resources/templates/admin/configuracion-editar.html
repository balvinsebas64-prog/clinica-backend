<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<button class="sidebar-toggle" onclick="document.querySelector('.app-sidebar').classList.toggle('show')">
    <i class="bi bi-list"></i>
</button>

<div class="app-content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">✏️ Editar Configuración</h1>
        <a href="/admin/configuracion" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div class="card shadow-sm border-0" style="max-width: 700px;">
        <div class="card-header bg-warning text-dark">
            <h5 class="mb-0"><i class="bi bi-sliders"></i> Editar Parámetro</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/configuracion/guardar}" method="post" th:object="${configuracion}">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{clave}">
                <input type="hidden" th:field="*{tipo}">
                <input type="hidden" th:field="*{fechaActualizacion}">

                <div class="mb-3">
                    <label class="form-label fw-bold">Clave</label>
                    <input type="text" class="form-control" th:value="*{clave}" disabled>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Descripción</label>
                    <input type="text" class="form-control" th:field="*{descripcion}" disabled>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Valor *</label>
                    <input type="text" class="form-control" th:field="*{valor}" required>
                </div>

                <hr>
                <div class="d-flex justify-content-end gap-2">
                    <a href="/admin/configuracion" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
