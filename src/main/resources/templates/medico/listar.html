<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-0"><i class="bi bi-person-badge-fill text-success"></i> Gestión de Médicos</h1>
            <p class="text-muted mb-0">Buscar y administrar médicos con sus credenciales de acceso</p>
        </div>
        <a href="/medicos/crear" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> Nuevo Médico
        </a>
    </div>

    <!-- BARRA DE BÚSQUEDA -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form method="get" action="/medicos" class="row g-3">
                <div class="col-md-5">
                    <label class="form-label fw-bold"><i class="bi bi-search"></i> Buscar médico</label>
                    <input type="text" name="buscar" class="form-control"
                           placeholder="Nombre o apellido del médico..."
                           th:value="${busqueda}">
                </div>
                <div class="col-md-5">
                    <label class="form-label fw-bold"><i class="bi bi-filter"></i> Filtrar por especialidad</label>
                    <select name="especialidad" class="form-select">
                        <option value="">-- Todas las especialidades --</option>
                        <option th:each="esp : ${especialidades}"
                                th:value="${esp.id}"
                                th:text="${esp.nombre}"
                                th:selected="${especialidadSeleccionada != null and especialidadSeleccionada == esp.id}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                </div>
            </form>
            <div class="mt-2">
                <a href="/medicos" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-clockwise"></i> Limpiar filtros
                </a>
                <span class="ms-2 text-muted small">
                    Mostrando <strong th:text="${#lists.size(medicos)}">0</strong> médicos
                </span>
            </div>
        </div>
    </div>

    <div th:if="${param.exito}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle"></i> <span th:text="${param.exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-success">
                    <tr>
                        <th>ID</th>
                        <th>Médico</th>
                        <th>DNI</th>
                        <th>Especialidad</th>
                        <th>Teléfono</th>
                        <th>CMP</th>
                        <th>🔑 Usuario</th>
                        <th>🔑 Contraseña</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${medicos}">
                        <td th:text="${m.id}"></td>
                        <td>
                            <strong th:text="${m.nombre}"></strong>
                        </td>
                        <td th:text="${m.dni}"></td>
                        <td>
                            <span class="badge bg-info"
                                  th:text="${m.especialidad != null ? m.especialidad.nombre : 'Sin asignar'}"></span>
                        </td>
                        <td th:text="${m.telefono}"></td>
                        <td th:text="${m.numeroColegiatura}"></td>
                        <td>
                            <code th:if="${m.usuario != null}" th:text="${m.usuario.username}" class="text-primary"></code>
                            <span th:if="${m.usuario == null}" class="text-muted small">Sin usuario</span>
                        </td>
                        <td>
                            <code th:if="${m.usuario != null}" th:text="${m.usuario.password}" class="text-danger"></code>
                            <span th:if="${m.usuario == null}" class="text-muted small">-</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/medicos/editar/{id}(id=${m.id})}" class="btn btn-warning btn-sm">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/medicos/eliminar/{id}(id=${m.id})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Eliminar este médico?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(medicos)}">
                        <td colspan="9" class="text-center text-muted py-4">
                            <i class="bi bi-search" style="font-size: 2rem;"></i>
                            <p class="mt-2">No se encontraron médicos</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
