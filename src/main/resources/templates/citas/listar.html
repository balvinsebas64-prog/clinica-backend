<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<button class="sidebar-toggle" onclick="document.querySelector('.app-sidebar').classList.toggle('show')">
    <i class="bi bi-list"></i>
</button>

<div class="app-content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-0"><i class="bi bi-calendar-check-fill text-primary"></i> Todas las Citas</h1>
            <p class="text-muted mb-0">Listado general de citas registradas en el sistema</p>
        </div>
        <a href="/citas/programar" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Nueva Cita
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Paciente</th>
                        <th>Médico</th>
                        <th>Fecha</th>
                        <th>Motivo</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${citas}">
                        <td th:text="${c.id}"></td>
                        <td th:text="${c.paciente.nombre + ' ' + c.paciente.apellido}"></td>
                        <td th:text="${c.medico != null ? c.medico.nombre + ' ' + c.medico.apellido : 'Sin asignar'}"></td>
                        <td th:text="${#temporals.format(c.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${c.motivo}"></td>
                        <td>
                            <span th:if="${c.estado.name() == 'PENDIENTE'}" class="badge bg-warning text-dark">PENDIENTE</span>
                            <span th:if="${c.estado.name() == 'CONFIRMADA'}" class="badge bg-info">CONFIRMADA</span>
                            <span th:if="${c.estado.name() == 'ATENDIDA'}" class="badge bg-success">ATENDIDA</span>
                            <span th:if="${c.estado.name() == 'CANCELADA'}" class="badge bg-danger">CANCELADA</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(citas)}">
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                            <p class="mt-2 mb-0">No hay citas registradas</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
