<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<button class="sidebar-toggle" onclick="document.querySelector('.app-sidebar').classList.toggle('show')">
    <i class="bi bi-list"></i>
</button>

<div class="app-content">

    <div class="page-header">
        <div>
            <h1 class="page-title"><i class="bi bi-x-circle text-danger"></i> Cancelar Citas</h1>
            <p class="page-subtitle">RF5 - Cancelación de Citas Médicas</p>
        </div>
        <button onclick="history.back()" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </button>
    </div>

    <!-- Mensaje de éxito -->
    <div th:if="${param.exito}" class="alert alert-success">
        <i class="bi bi-check-circle"></i> <span th:text="${param.exito}"></span>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-danger text-white">
            <h5 class="mb-0"><i class="bi bi-x-circle"></i> Citas Activas</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Paciente</th>
                        <th>Médico</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${citas}">
                        <td th:text="${c.id}"></td>
                        <td th:text="${c.paciente.nombre + ' ' + c.paciente.apellido}"></td>
                        <td th:text="${c.medico != null ? 'Dr. ' + c.medico.nombre + ' ' + c.medico.apellido : 'Sin asignar'}"></td>
                        <td th:text="${#temporals.format(c.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <span th:if="${c.estado.name() == 'CANCELADA'}" class="badge bg-danger">CANCELADA</span>
                            <span th:if="${c.estado.name() == 'ATENDIDA'}" class="badge bg-success">ATENDIDA</span>
                            <span th:if="${c.estado.name() == 'PENDIENTE'}" class="badge bg-warning text-dark">PENDIENTE</span>
                            <span th:if="${c.estado.name() == 'CONFIRMADA'}" class="badge bg-info text-dark">CONFIRMADA</span>
                        </td>
                        <td>
                            <a th:if="${c.estado.name() != 'CANCELADA' and c.estado.name() != 'ATENDIDA'}"
                               th:href="@{/citas/cancelar/{id}(id=${c.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Cancelar esta cita?')">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                            <span th:if="${c.estado.name() == 'CANCELADA' or c.estado.name() == 'ATENDIDA'}"
                                  class="text-muted small">
                                <i class="bi bi-lock"></i> No cancelable
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(citas)}">
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                            <p class="mt-2 mb-0">No hay citas registradas</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>

<script>
    document.addEventListener('click', function(e) {
        const sidebar = document.querySelector('.app-sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        if (window.innerWidth <= 992 && sidebar && sidebar.classList.contains('show')) {
            if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                sidebar.classList.remove('show');
            }
        }
    });
</script>

</body>
</html>
