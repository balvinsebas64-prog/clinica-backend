<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<button class="sidebar-toggle" onclick="document.querySelector('.app-sidebar').classList.toggle('show')">
    <i class="bi bi-list"></i>
</button>

<div class="app-content" style="background-color: #f4f7f6; padding: 30px;">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1" style="color: #2d3748;"><i class="bi bi-shield-lock-fill text-warning"></i> Gestión de Usuarios</h2>
            <p class="text-muted mb-0">Registrar, editar y eliminar usuarios del sistema</p>
        </div>
        <a href="/usuarios/crear" class="btn btn-warning fw-bold">
            <i class="bi bi-plus-circle"></i> Nuevo Usuario
        </a>
    </div>

    <div th:if="${param.exito}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle"></i> <span th:text="${param.exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- ⭐ BUSCADOR Y FILTRO ⭐ -->
    <div class="card border-0 shadow-sm mb-4" style="border-radius: 15px;">
        <div class="card-body p-4">
            <form method="get" action="/usuarios" class="row g-3 align-items-end">
                <!-- Buscador de texto -->
                <div class="col-md-5">
                    <label class="form-label fw-bold"><i class="bi bi-search"></i> Buscar usuario</label>
                    <input type="text" name="buscar" class="form-control" 
                           placeholder="Nombre, username o email..." 
                           th:value="${buscar}">
                </div>
                
                <!-- Filtro de Rol -->
                <div class="col-md-4">
                    <label class="form-label fw-bold"><i class="bi bi-funnel"></i> Filtrar por Rol</label>
                    <select name="rolId" class="form-select">
                        <option value="">-- Todos los roles --</option>
                        <option th:each="r : ${roles}" 
                                th:value="${r.id}" 
                                th:text="${r.nombre}"
                                th:selected="${rolSeleccionado != null and rolSeleccionado == r.id}">
                        </option>
                    </select>
                </div>
                
                <!-- Botón Buscar -->
                <div class="col-md-3">
                    <button type="submit" class="btn btn-warning w-100 fw-bold text-dark">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                </div>
            </form>
            <div class="mt-3">
                <a href="/usuarios" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-clockwise"></i> Limpiar filtros
                </a>
                <span class="ms-2 text-muted small">
                    Mostrando <strong th:text="${#lists.size(usuarios)}">0</strong> usuarios
                </span>
            </div>
        </div>
    </div>

    <!-- TABLA -->
    <div class="card border-0 shadow-sm" style="border-radius: 15px;">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Nombre Completo</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}"></td>
                        <td><strong th:text="${u.username}"></strong></td>
                        <td th:text="${u.nombreCompleto}"></td>
                        <td th:text="${u.email}"></td>
                        <td>
                            <span th:each="rol : ${u.roles}" class="badge bg-primary me-1" th:text="${rol.nombre}"></span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${u.enabled} ? 'bg-success' : 'bg-danger'"
                                  th:text="${u.enabled} ? 'Activo' : 'Inactivo'"></span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-warning btn-sm">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                            <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Eliminar este usuario?')">
                                <i class="bi bi-trash"></i> Eliminar
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                            <p class="mt-2 mb-0">No se encontraron usuarios</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>

<script>
    document.addEventListener('click', function(e) {
        const sidebar = document.querySelector('.app-sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        if (window.innerWidth <= 992 && sidebar && sidebar.classList.contains('show')) {
            if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                sidebar.classList.remove('show');
            }
        }
    });
</script>

</body>
</html>
