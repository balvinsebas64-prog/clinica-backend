<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-0"><i class="bi bi-shield-lock-fill text-warning"></i> Gestión de Usuarios</h1>
            <p class="text-muted mb-0">Registrar, editar y eliminar usuarios del sistema</p>
        </div>
        <a href="/usuarios/crear" class="btn btn-warning">
            <i class="bi bi-plus-circle"></i> Nuevo Usuario
        </a>
    </div>

    <div th:if="${param.exito}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle"></i> <span th:text="${param.exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-warning">
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Nombre Completo</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}"></td>
                        <td><strong th:text="${u.username}"></strong></td>
                        <td th:text="${u.nombreCompleto}"></td>
                        <td th:text="${u.email}"></td>
                        <td>
                            <span th:each="rol : ${u.roles}" class="badge bg-primary me-1"
                                  th:text="${rol.nombre}"></span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.enabled} ? 'bg-success' : 'bg-danger'"
                                  th:text="${u.enabled} ? 'Activo' : 'Inactivo'"></span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-warning btn-sm">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                            <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Eliminar este usuario?')">
                                <i class="bi bi-trash"></i> Eliminar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
