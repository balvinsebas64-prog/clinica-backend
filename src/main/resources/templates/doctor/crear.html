<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm border-0">
                <div class="card-header" th:classappend="${modoEdicion} ? 'bg-warning text-dark' : 'bg-success text-white'">
                    <h4 class="mb-0">
                        <i class="bi" th:classappend="${modoEdicion} ? 'bi-pencil-square' : 'bi-person-plus-fill'"></i>
                        <span th:text="${modoEdicion} ? 'Editar Médico' : 'Registrar Nuevo Médico'"></span>
                    </h4>
                </div>
                <div class="card-body p-4">

                    <form th:action="@{/medicos/guardar}" th:object="${medico}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Nombre *</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Apellido *</label>
                                <input type="text" class="form-control" th:field="*{apellido}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">DNI *</label>
                                <input type="text" class="form-control" th:field="*{dni}" maxlength="8" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Teléfono</label>
                                <input type="text" class="form-control" th:field="*{telefono}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" class="form-control" th:field="*{email}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">N° Colegiatura</label>
                                <input type="text" class="form-control" th:field="*{numeroColegiatura}" placeholder="Ej: CMP-12345">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Especialidad</label>
                            <select class="form-select" th:field="*{especialidad}">
                                <option value="">-- Seleccione una especialidad --</option>
                                <option th:each="esp : ${especialidades}"
                                        th:value="${esp.id}"
                                        th:text="${esp.nombre}"></option>
                            </select>
                        </div>

                        <hr>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="/medicos" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </a>
                            <button type="submit" class="btn"
                                    th:classappend="${modoEdicion} ? 'btn-warning' : 'btn-success'">
                                <i class="bi bi-save"></i>
                                <span th:text="${modoEdicion} ? 'Actualizar Médico' : 'Guardar Médico'"></span>
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
