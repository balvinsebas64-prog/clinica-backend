<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión -Hospital EsSalud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0066cc 0%, #004a99 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }
        .login-left {
            background: linear-gradient(135deg, #0066cc 0%, #004a99 100%);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-right {
            padding: 60px 40px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
        }
        .form-control:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 0.2rem rgba(0,102,204,0.15);
        }
        .btn-login {
            background: linear-gradient(135deg, #0066cc 0%, #004a99 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: transform 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,102,204,0.4);
        }
        .icon-circle {
            font-size: 4rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="row g-0">
        <div class="col-md-5 login-left">
            <div class="icon-circle">🏥</div>
            <h2>Hospital EsSalud</h2>
            <p class="mt-3">Sistema de Gestión de Pacientes, Citas e Historias Clínicas</p>
            <hr class="my-4" style="border-color: rgba(255,255,255,0.3);">
            <small>Accede con tus credenciales para continuar</small>
        </div>

        <div class="col-md-7 login-right">
            <h3 class="mb-4">Iniciar Sesión</h3>

            <!-- Mensaje de error -->
            <div th:if="${param.error}" class="alert alert-danger">
                <i class="bi bi-exclamation-triangle"></i> Usuario o contraseña incorrectos
            </div>

            <!-- Mensaje de logout -->
            <div th:if="${param.logout}" class="alert alert-success">
                <i class="bi bi-check-circle"></i> Sesión cerrada correctamente
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">
                        <i class="bi bi-person-fill"></i> Usuario
                    </label>
                    <input type="text" name="username" class="form-control" placeholder="Ingresa tu usuario" required autofocus>
                </div>

                <div class="mb-4">
                    <label class="form-label">
                        <i class="bi bi-lock-fill"></i> Contraseña
                    </label>
                    <input type="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="btn btn-login">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar
                </button>
            </form>
<hr class="my-4">
<div class="text-center">
    <p class="text-muted mb-2">¿No tienes una cuenta?</p>
    <a href="/registro" class="btn btn-outline-primary btn-lg w-100">
        <i class="bi bi-person-plus-fill"></i> Registrarme como Paciente
    </a>
</div>
        </div>
    </div>
</div>

</body>
</html>
