<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<button class="sidebar-toggle" onclick="document.querySelector('.app-sidebar').classList.toggle('show')">
    <i class="bi bi-list"></i>
</button>

<div class="app-content">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm border-0">
                <div class="card-header" th:classappend="${modoEdicion} ? 'bg-warning text-dark' : 'bg-success text-white'">
                    <h4 class="mb-0">
                        <i class="bi" th:classappend="${modoEdicion} ? 'bi-pencil-square' : 'bi-person-plus-fill'"></i>
                        <span th:text="${modoEdicion} ? 'Editar Paciente' : 'Registrar Nuevo Paciente'"></span>
                    </h4>
                </div>
                <div class="card-body p-4">

                    <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <!-- DATOS PERSONALES -->
                        <h5 class="text-primary mb-3"><i class="bi bi-person-fill"></i> Datos Personales</h5>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Nombre *</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Apellido *</label>
                                <input type="text" class="form-control" th:field="*{apellido}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">DNI *</label>
                                <input type="text" class="form-control" th:field="*{dni}" maxlength="8" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Teléfono</label>
                                <input type="text" class="form-control" th:field="*{telefono}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" class="form-control" th:field="*{email}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Fecha de Nacimiento</label>
                                <input type="date" class="form-control" th:field="*{fechaNacimiento}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Dirección</label>
                            <textarea class="form-control" th:field="*{direccion}" rows="2"></textarea>
                        </div>

                        <!-- ⭐ DATOS DEL SEGURO -->
                        <hr class="my-4">
                        <h5 class="text-primary mb-3"><i class="bi bi-shield-check"></i> Datos del Seguro EsSalud</h5>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Número de Afiliación *</label>
                                <input type="text" 
                                       name="numeroAfiliacion" 
                                       class="form-control" 
                                       placeholder="Ej: ESS-2026-12345678" 
                                       th:value="${seguro != null ? seguro.numeroAfiliacion : ''}" 
                                       required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Centro Asistencial Asignado *</label>
                                <select name="establecimientoId" class="form-select" required>
                                    <option value="">-- Seleccione centro --</option>
                                    <option th:each="est : ${establecimientos}" 
                                            th:value="${est.id}" 
                                            th:text="${est.nombre}"
                                            th:selected="${seguro != null and seguro.establecimiento != null and seguro.establecimiento.id == est.id}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <hr>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="/pacientes" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </a>
                            <button type="submit" class="btn" 
                                    th:classappend="${modoEdicion} ? 'btn-warning' : 'btn-success'">
                                <i class="bi bi-save"></i>
                                <span th:text="${modoEdicion} ? 'Actualizar Paciente' : 'Guardar Paciente'"></span>
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>

<script>
    document.addEventListener('click', function(e) {
        const sidebar = document.querySelector('.app-sidebar');
        const toggle = document.querySelector('.sidebar-toggle');
        if (window.innerWidth <= 992 && sidebar && sidebar.classList.contains('show')) {
            if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                sidebar.classList.remove('show');
            }
        }
    });
</script>

</body>
</html>
