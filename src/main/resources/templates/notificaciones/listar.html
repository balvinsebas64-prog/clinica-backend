<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<button class="sidebar-toggle" onclick="document.querySelector('.app-sidebar').classList.toggle('show')">
    <i class="bi bi-list"></i>
</button>

<div class="app-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-0"><i class="bi bi-bell-fill text-warning"></i> Mis Notificaciones</h1>
            <p class="text-muted mb-0">Tienes <strong th:text="${noLeidas}">0</strong> notificaciones sin leer</p>
        </div>
        <a href="/notificaciones/leer-todas" class="btn btn-outline-primary">
            <i class="bi bi-check-all"></i> Marcar todas como leídas
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(notificaciones)}" class="text-center text-muted py-5">
                <i class="bi bi-bell-slash" style="font-size: 3rem;"></i>
                <p class="mt-2 mb-0">No tienes notificaciones por ahora.</p>
            </div>

            <ul class="list-group list-group-flush" th:unless="${#lists.isEmpty(notificaciones)}">
                <li th:each="n : ${notificaciones}" 
                    class="list-group-item d-flex align-items-start"
                    th:classappend="${!n.leida} ? 'bg-light fw-bold' : ''">
                    
                    <div class="me-3 mt-1">
                        <i class="bi bi-info-circle-fill text-primary fs-4" th:if="${!n.leida}"></i>
                        <i class="bi bi-info-circle text-muted fs-4" th:if="${n.leida}"></i>
                    </div>

                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between">
                            <h6 class="mb-1" th:text="${n.titulo}">Título</h6>
                            <small class="text-muted" th:text="${#temporals.format(n.fechaCreacion, 'dd/MM/yyyy HH:mm')}">Fecha</small>
                        </div>
                        <p class="mb-1 small" th:text="${n.mensaje}">Mensaje</p>
                        
                        <a th:if="${!n.leida}" th:href="@{/notificaciones/leer/{id}(id=${n.id})}" class="btn btn-sm btn-outline-secondary mt-2">
                            <i class="bi bi-check"></i> Marcar como leída
                        </a>
                        <span th:if="${n.leida}" class="badge bg-success mt-2">
                            <i class="bi bi-check-circle"></i> Leída
                        </span>
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
