<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<button class="sidebar-toggle" onclick="document.querySelector('.app-sidebar').classList.toggle('show')">
    <i class="bi bi-list"></i>
</button>

<div class="app-content">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white text-center">
                    <h3 class="mb-0"><i class="bi bi-receipt"></i> Voucher de Pago de Seguro</h3>
                </div>
                <div class="card-body p-4 text-center">

                    <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
                    <h2 class="text-success mt-3">¡Pago Exitoso!</h2>
                    <p class="text-muted">Tu seguro ha sido activado correctamente.</p>

                    <hr class="my-4">

                    <div class="text-start">
                        <p><strong>Recibo N°:</strong> <span th:text="${pago.id}"></span></p>
                        <p><strong>Paciente:</strong> <span th:text="${pago.seguro.paciente.nombre} + ' ' + ${pago.seguro.paciente.apellido}"></span></p>
                        <p><strong>N° Afiliación:</strong> <span th:text="${pago.seguro.numeroAfiliacion}"></span></p>
                        <p><strong>Mes Pagado:</strong> <span th:text="${pago.mesPagado}"></span></p>
                        <p><strong>Monto:</strong> S/ <span th:text="${pago.monto}"></span></p>
                        <p><strong>Método de Pago:</strong> <span th:text="${pago.estado}"></span></p>
                        <p><strong>Fecha:</strong> <span th:text="${#temporals.format(pago.fechaPago, 'dd/MM/yyyy HH:mm')}"></span></p>
                        <p><strong>Estado:</strong> <span class="badge bg-success">PAGADO</span></p>
                    </div>

                    <hr class="my-4">

                    <div class="d-flex justify-content-center gap-2">
                        <a href="/paciente" class="btn btn-primary">
                            <i class="bi bi-house-door"></i> Volver al Panel
                        </a>
                        <button onclick="window.print()" class="btn btn-outline-secondary">
                            <i class="bi bi-printer"></i> Imprimir
                        </button>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
