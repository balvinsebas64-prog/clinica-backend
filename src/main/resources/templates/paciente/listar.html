<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-0"><i class="bi bi-people-fill text-primary"></i> Gestión de Pacientes</h1>
            <p class="text-muted mb-0">Registrar, editar y eliminar pacientes</p>
        </div>
        <a href="/pacientes/crear" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> Nuevo Paciente
        </a>
    </div>

    <!-- Mensaje de éxito -->
    <div th:if="${param.exito}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle"></i> <span th:text="${param.exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>DNI</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${pacientes}">
                        <td th:text="${p.id}"></td>
                        <td th:text="${p.nombre}"></td>
                        <td th:text="${p.apellido}"></td>
                        <td th:text="${p.dni}"></td>
                        <td th:text="${p.telefono}"></td>
                        <td th:text="${p.email}"></td>
                        <td class="text-center">
                            <a th:href="@{/pacientes/editar/{id}(id=${p.id})}"
                               class="btn btn-warning btn-sm">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                            <a th:href="@{/pacientes/eliminar/{id}(id=${p.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Estás seguro de eliminar este paciente?')">
                                <i class="bi bi-trash"></i> Eliminar
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pacientes)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                            <p class="mt-2">No hay pacientes registrados</p>
                            <a href="/pacientes/crear" class="btn btn-primary btn-sm">
                                <i class="bi bi-plus-circle"></i> Registrar el primero
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
