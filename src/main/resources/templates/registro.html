<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Paciente - Hospital EsSalud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0066cc 0%, #004a99 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .registro-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }
        .registro-header {
            background: linear-gradient(135deg, #0066cc 0%, #004a99 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .registro-body {
            padding: 40px;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
        }
        .form-control:focus, .form-select:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 0.2rem rgba(0,102,204,0.15);
        }
        .btn-registrar {
            background: linear-gradient(135deg, #0066cc 0%, #004a99 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: transform 0.2s;
        }
        .btn-registrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,102,204,0.4);
        }
    </style>
</head>
<body>

<div class="registro-card">
    <div class="registro-header">
        <i class="bi bi-person-plus-fill" style="font-size: 3rem;"></i>
        <h2 class="mt-3">Registro de Paciente</h2>
        <p class="mb-0">Hospital EsSalud</p>
    </div>

    <div class="registro-body">

        <!-- Mensaje de error -->
        <div th:if="${error}" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/registro/guardar}" method="post">

            <h5 class="text-primary mb-3"><i class="bi bi-person"></i> Datos Personales</h5>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Nombre *</label>
                    <input type="text" name="nombre" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Apellido *</label>
                    <input type="text" name="apellido" class="form-control" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">DNI *</label>
                    <input type="text" name="dni" class="form-control" maxlength="8" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Teléfono</label>
                    <input type="text" name="telefono" class="form-control">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Email *</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Fecha de Nacimiento</label>
                    <input type="date" name="fechaNacimiento" class="form-control">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Dirección</label>
                <textarea name="direccion" class="form-control" rows="2"></textarea>
            </div>

            <hr class="my-4">
            <h5 class="text-primary mb-3"><i class="bi bi-key"></i> Credenciales de Acceso</h5>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Usuario *</label>
                    <input type="text" name="username" class="form-control" required
                           placeholder="Ej: juan.perez">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Contraseña *</label>
                    <input type="password" name="password" class="form-control" required
                           placeholder="Mínimo 6 caracteres">
                </div>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a href="/login" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Volver al Login
                </a>
                <button type="submit" class="btn btn-registrar" style="width: auto; padding: 12px 40px;">
                    <i class="bi bi-check-circle"></i> Registrarme
                </button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
